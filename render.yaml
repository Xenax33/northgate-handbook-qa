# Render Blueprint: deploys the web app on Render's free plan.
# In Render: New > Blueprint > pick this repository > enter GEMINI_API_KEY > Apply.
#
# Free plan: 512 MB of memory and a tenth of a CPU; sleeps after 15 minutes without visitors and takes
# about a minute to wake; the disk is reset on every restart, so uploaded documents disappear.
# The build downloads the search model and computes the passage vectors (python -m handbook_qa.prepare),
# so waking up only loads them. Measured locally: about 270 MB while serving.
services:
  - type: web
    name: northgate-handbook-qa
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev && .venv/bin/python -m handbook_qa.prepare
    startCommand: .venv/bin/handbook-web
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION          # Render installs this Python; uv must use it (next line)
        value: 3.12.10
      - key: UV_PYTHON_DOWNLOADS     # don't download a Python that wouldn't survive into runtime
        value: never
      - key: HOST                    # listen on all interfaces; Render sets PORT itself
        value: 0.0.0.0
      - key: GEMINI_API_KEY          # secret: typed into Render's dashboard, never stored in the repo
        sync: false
      - key: UPLOAD_TOKEN            # uploads on the public link need this; Render generates a random value
        generateValue: true
